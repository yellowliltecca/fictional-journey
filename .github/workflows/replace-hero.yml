name: Replace homepage hero image

on:
  push:
    branches: [main]
    paths:
      - "tmp-hero/part-4.b64"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore image and update homepage
        run: |
          cat tmp-hero/part-*.b64 | tr -d '\r\n\t ' | base64 --decode > assets/hero-victoria.webp
          test -s assets/hero-victoria.webp
          python3 - <<'PY'
          from pathlib import Path
          import re
          html_path = Path("index.html")
          css_path = Path("styles.css")
          html = html_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")
          html, html_count = re.subn(
              r'(<meta property="og:image" content=")[^"]+(">)',
              r'\1https://yellowliltecca.github.io/fictional-journey/assets/hero-victoria.webp\2',
              html,
              count=1
          )
          css, css_count = re.subn(
              r'background: var\(--paper-deep\) url\("[^"]+"\) center right / cover no-repeat;',
              'background: var(--paper-deep) url("assets/hero-victoria.webp") center right / cover no-repeat;',
              css,
              count=1
          )
          if html_count != 1 or css_count != 1:
              raise SystemExit(f"Could not update hero references: html={html_count}, css={css_count}")
          html_path.write_text(html, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          PY
          file assets/hero-victoria.webp

      - name: Commit final site files
        run: |
          rm -rf tmp-hero
          rm -f .github/workflows/replace-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace homepage hero with generated podology image"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
